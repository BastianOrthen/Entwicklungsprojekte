<!--
  ADSB Tracking Web Interface
  
  This page displays real-time aircraft tracking data using:
  - Leaflet: Interactive map with aircraft markers and flight paths
  - JavaScript polling: Fetches sorted aircraft table every 1 second
  - Custom UI: Table with sortable columns and overlay controls
  
  Layout:
  - Full-screen Leaflet map (background)
  - Fixed overlay with aircraft table (bottom-left)
  - Floating control buttons (hide/show overlay, clear tracks, toggle paths)
  
  The table columns (ICAO, Callsign, Alt, Speed, Heading, Squawk, RSSI) are clickable
  to sort by that column. The sorting persists across polling updates.
  
  Selecting an aircraft either via table click or map marker will highlight it
  in blue and show its properties in the overlay.
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADSB Tracking - Real-time Aircraft Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Full-screen map */
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    /* Aircraft marker styling (plane icon) */
    .plane-icon {
      font-size: 24px;
      line-height: 24px;
      text-align: center;
      text-shadow: 0 0 2px rgba(0,0,0,0.6);
      transform: translateY(-6px);
      pointer-events: auto;
      cursor: pointer;
    }
    
    /* Popup info box styling */
    .track-popup {
      font-size: 13px;
    }
    
    /* Table header styling - sortable columns */
    th[data-sort] {
      user-select: none;
      position: relative;
      cursor: pointer;
    }
    
    /* Sort direction indicators (▲/▼) */
    th[data-sort]::after {
      content: '';
      display: inline-block;
      width: 0;
      margin-left: 5px;
    }
    
    th[data-sort].sort-asc::after {
      content: '▲';
      color: #3498db;
      font-weight: bold;
    }
    
    th[data-sort].sort-desc::after {
      content: '▼';
      color: #3498db;
      font-weight: bold;
    }
    
    /* Highlighted selected aircraft row */
    tbody tr.selected {
      background-color: #3498db !important;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Full-screen Leaflet map -->
  <div id="map"></div>
  
  <!-- Load main JavaScript client -->
  <script src="main-htmx.js"></script>
  
  <!-- Fixed overlay with aircraft table and controls -->
  <div id="adsb-debug-overlay" style="position:fixed;left:8px;bottom:8px;z-index:99999;background:rgba(0,0,0,0.8);color:#fff;padding:8px;border-radius:6px;font-family:Arial,Helvetica,sans-serif;font-size:13px;max-width:500px;max-height:60vh;overflow-y:auto;">
    
    <!-- Header with title and buttons -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <strong>✈ ADSB Tracking</strong>
      <div>
        <button id="adsb-clear-tracks" title="Clear all flight paths" style="padding:4px 6px;border-radius:4px;border:none;cursor:pointer;background:#e74c3c;color:#fff;margin-right:4px;font-size:11px;">Clear</button>
        <button id="adsb-toggle-polys" title="Show/hide flight paths" style="padding:4px 6px;border-radius:4px;border:none;cursor:pointer;background:#3498db;color:#fff;margin-right:4px;font-size:11px;">Paths</button>
        <button id="adsb-hide-overlay" title="Hide this panel" style="padding:4px 6px;border-radius:4px;border:none;cursor:pointer;background:#9b59b6;color:#fff;font-size:11px;">Hide</button>
      </div>
    </div>
    
    <!-- Sortable aircraft table -->
    <table id="adsb-debug-table" style="width:100%;border-collapse:collapse;font-size:12px;background:#1a1a1a;">
      <thead>
        <tr style="border-bottom:2px solid #3498db;">
          <th style="text-align:left;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="id" title="Click to sort by ICAO">ICAO</th>
          <th style="text-align:left;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="callsign" title="Click to sort by Callsign">Callsign</th>
          <th style="text-align:right;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="alt" title="Click to sort by Altitude">Alt (ft)</th>
          <th style="text-align:right;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="spd" title="Click to sort by Speed">Spd (kt)</th>
          <th style="text-align:right;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="hdg" title="Click to sort by Heading">Hdg</th>
          <th style="text-align:right;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="squawk" title="Click to sort by Squawk">SQK</th>
          <th style="text-align:right;padding:4px 6px;cursor:pointer;user-select:none;" data-sort="rssi" title="Click to sort by Signal Strength">RSSI</th>
        </tr>
      </thead>
      <!-- Table body populated via JavaScript polling -->
      <tbody id="adsb-debug-body">
      </tbody>
    </table>
    
    <!-- Help text -->
    <div id="adsb-debug-note" style="margin-top:6px;font-size:11px;opacity:0.8;color:#aaa;">
      Click column headers to sort • Click rows or markers to select aircraft
    </div>
  </div>
  
  <!-- Floating button shown when overlay is hidden -->
  <button id="adsb-show-icon" title="Show aircraft table" style="display:none;position:fixed;left:8px;bottom:8px;z-index:100000;background:#2ecc71;color:#000;border:none;border-radius:20px;width:40px;height:40px;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:pointer;font-weight:bold;font-size:16px;">▦</button>
  
  <!-- Overlay visibility controls and button handlers -->
  <script>
    // Handle show/hide overlay panel
    (function(){
      const hideBtn = document.getElementById('adsb-hide-overlay');
      const overlay = document.getElementById('adsb-debug-overlay');
      const showIcon = document.getElementById('adsb-show-icon');
      
      if (hideBtn && overlay) {
        hideBtn.onclick = () => {
          if (overlay.style.display === 'none') {
            overlay.style.display = 'block';
            showIcon.style.display = 'none';
          } else {
            overlay.style.display = 'none';
            showIcon.style.display = 'block';
          }
        };
      }
      
      if (showIcon && overlay) {
        showIcon.onclick = () => {
          overlay.style.display = 'block';
          showIcon.style.display = 'none';
        };
      }
      
      // Clear all flight paths button
      const clearBtn = document.getElementById('adsb-clear-tracks');
      if (clearBtn) {
        clearBtn.onclick = () => {
          if (typeof aircraft !== 'undefined') {
            for (const entry of aircraft.values()) {
              if (entry.polylineGroup) map.removeLayer(entry.polylineGroup);
              if (entry.marker) map.removeLayer(entry.marker);
            }
            aircraft.clear();
          }
        };
      }
      
      // Toggle flight paths visibility
      const toggleBtn = document.getElementById('adsb-toggle-polys');
      if (toggleBtn) {
        toggleBtn.onclick = () => {
          if (typeof aircraft !== 'undefined') {
            for (const entry of aircraft.values()) {
              if (entry.polylineGroup) {
                if (map.hasLayer(entry.polylineGroup)) {
                  map.removeLayer(entry.polylineGroup);
                } else {
                  map.addLayer(entry.polylineGroup);
                }
              }
            }
          }
        };
      }
    })();
  </script>
</body>
</html>
